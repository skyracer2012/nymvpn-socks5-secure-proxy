[supervisord]
nodeamon=true

[program:dbus]
command=dbus-daemon --system
priority=10
startsecs=1
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:polkit]
command=/usr/lib/polkit-1/polkitd --no-debug
priority=20
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vpnd]
command=/usr/bin/nym-vpnd
priority=30
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vpnc]
command=/usr/local/bin/vpnc-handler.sh
priority=40
startsecs=1
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0